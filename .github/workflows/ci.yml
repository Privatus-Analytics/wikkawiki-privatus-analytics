name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["7.0", "7.4", "8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Action tests
        run: php tests/ActionTest.php

  wikkawiki:
    # Installs a real WikkaWiki in Docker and checks the tag.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify in WikkaWiki 1.4.2
        run: ./scripts/verify-docker.sh 1.4.2
